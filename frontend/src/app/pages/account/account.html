<!-- The route guard only lets logged-in users in, so user() is set here. -->
@if (user(); as user) {
  <div class="page">
    <h1>{{ 'account.title' | transloco }}</h1>
    <p class="muted">{{ user.email }}</p>

    <section class="box">
      <h2>{{ 'account.export' | transloco }}</h2>
      <button mat-stroked-button type="button" (click)="exportData()">{{ 'account.export' | transloco }}</button>
    </section>

    <section class="box danger">
      <h2>{{ 'account.deleteTitle' | transloco }}</h2>
      <p>{{ 'account.deleteWarning' | transloco }}</p>
      <button mat-flat-button type="button" class="danger" (click)="deleteAccount()">
        {{ 'account.delete' | transloco }}
      </button>
    </section>

    @if (error(); as error) {
      <p class="error" role="alert">{{ error | transloco }}</p>
    }
    <a class="back" routerLink="/">{{ 'account.back' | transloco }}</a>
  </div>
}
