version: 2
updates:
  # Maven dependencies (Spring Boot, Stripe SDK, Hibernate, …)
  - package-ecosystem: maven
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # All backend minor/patch bumps arrive as a single PR.
      # Major bumps stay as individual PRs so they can be reviewed one at a time.
      backend-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm dependencies (Angular frontend)
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # Angular packages are version-locked to each other and must upgrade
      # together — including TypeScript, whose supported range Angular dictates.
      # Grouping them means one coordinated PR instead of ~9 separate ones.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "typescript"
      # Everything else on the frontend, minor/patch only, as one PR.
      frontend-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "typescript"
        update-types:
          - "minor"
          - "patch"

  # The GitHub Actions used by our CI workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      # Action bumps are low-risk; batch them all (incl. majors) into one PR.
      github-actions:
        patterns:
          - "*"
