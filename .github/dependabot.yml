version: 2
updates:
  # Maven dependencies (Spring Boot, Stripe SDK, Hibernate, …)
  - package-ecosystem: maven
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # All backend minor/patch bumps arrive as a single PR.
      # Major bumps stay as individual PRs so they can be reviewed one at a time.
      backend-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm dependencies (Angular frontend)
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # Major Angular versions are upgraded by hand with `ng update`, which also runs Angular's code migrations; a
    # bare version bump skips them (and once proposed TypeScript 7 alongside Angular 22, which needs TypeScript 6).
    # TypeScript's major version is dictated by Angular's supported range, so it moves with those upgrades too.
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # Angular packages are version-locked to each other and must upgrade
      # together. Grouping them means one coordinated PR instead of ~9 separate ones.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
      # Everything else on the frontend, minor/patch only, as one PR.
      frontend-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "typescript"
        update-types:
          - "minor"
          - "patch"

  # The GitHub Actions used by our CI workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      # Action bumps are low-risk; batch them all (incl. majors) into one PR.
      github-actions:
        patterns:
          - "*"
