name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Docker is available on the runner, so the Testcontainers-based
      # integration tests run without any extra setup.
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --legacy-peer-deps works around an npm arborist bug with Angular 21's
      # test stack (vitest -> jsdom -> optional canvas). See frontend/README.md.
      - name: Install
        run: npm ci --legacy-peer-deps

      # The API client is generated from openapi/asbl-club-api.json (which the backend's
      # OpenApiContractTest keeps in sync with the API). Fail if someone changed the contract
      # without regenerating, or edited generated code by hand.
      - name: Set up JDK 21 (runs the OpenAPI generator)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Generated API client is up to date
        run: |
          npm run api:generate
          git diff --exit-code -- src/app/api/generated

      - name: Test
        run: npx ng test --watch=false

      - name: Type-check the Cloudflare Worker (the /api proxy)
        run: npm run worker:check

      - name: Build
        run: npm run build

  # A real browser through the real stack, shaped like production: Chromium → the Cloudflare Worker
  # (run locally by Wrangler: the built app, security headers, link previews, the /api proxy and its secret)
  # → Spring → PostgreSQL, with the backend's demo data. Catches what unit tests with a faked other side can't.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: asbl
          POSTGRES_USER: asbl
          POSTGRES_PASSWORD: asbl
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend (tested in its own job)
        working-directory: backend
        run: ./mvnw -B -q package -DskipTests

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The Worker's local settings: the API on this machine, and a throwaway secret shared with it below.
      - name: Configure the local Worker
        working-directory: frontend
        run: printf 'API_ORIGIN=http://localhost:8080\nEDGE_PROXY_SECRET=ci-only-edge-secret\n' > .dev.vars

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run e2e
        env:
          CI: 'true'
          E2E_BACKEND_COMMAND: >-
            java -jar ../backend/target/asbl-club-0.0.1-SNAPSHOT.jar
            --spring.profiles.active=demo --spring.docker.compose.enabled=false
          E2E_FRONTEND_COMMAND: npm run build && npx wrangler dev --port 4200
          E2E_THROUGH_WORKER: 'true'
          WRANGLER_SEND_METRICS: 'false'
          EDGE_PROXY_SECRET: ci-only-edge-secret
          EDGE_PUBLIC_URL: http://localhost:4200
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/asbl
          SPRING_DATASOURCE_USERNAME: asbl
          SPRING_DATASOURCE_PASSWORD: asbl
          # The flows sign up several accounts per run from one address; the limiter has its own tests.
          RATE_LIMIT_ENABLED: 'false'

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # Continuous deployment of the site: after every merge to main whose checks all pass, the Cloudflare Worker (the
  # Angular app, the /api proxy, link previews) is deployed from that exact commit, so the live site always matches
  # main. The backend is deployed by Render itself once these checks pass ("Auto-Deploy: After CI Checks Pass").
  deploy:
    name: Deploy the site (Cloudflare Worker)
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The Cloudflare token only exists in this GitHub environment (restricted to main): pull requests,
    # including ones from forks, never see it.
    environment:
      name: production
      url: https://asbl-club.ynhassan22.workers.dev
    # One deploy at a time, in merge order; a newer one waits instead of racing.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build the app
        working-directory: frontend
        run: npm run build

      # Cloudflare's official action, using the project's own Wrangler version and wrangler.jsonc.
      # The Worker's secret (EDGE_PROXY_SECRET) is already stored in Cloudflare and kept across deploys.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy

      # The live site answers with the app, and the API answers through it (Problem Details from Spring).
      # The API server may be waking up: a few tries with a generous time limit.
      - name: Smoke test the live site
        env:
          SITE: https://asbl-club.ynhassan22.workers.dev
        run: |
          curl --fail --silent --show-error --max-time 30 "$SITE/" | grep -q '<app-root'
          for attempt in 1 2 3; do
            type=$(curl --silent --output /dev/null --max-time 120 --write-out '%{http_code} %{content_type}' \
              "$SITE/api/v1/asbls/smoke-test-does-not-exist") || true
            echo "attempt $attempt: $type"
            case "$type" in "404 application/problem+json"*) exit 0 ;; esac
            sleep 10
          done
          exit 1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fails the pull request if it introduces a dependency with a known
      # high-severity vulnerability — the dependency audit in CI.
      - name: Review dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
