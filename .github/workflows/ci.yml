name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Docker is available on the runner, so the Testcontainers-based
      # integration tests run without any extra setup.
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --legacy-peer-deps works around an npm arborist bug with Angular 21's
      # test stack (vitest -> jsdom -> optional canvas). See frontend/README.md.
      - name: Install
        run: npm ci --legacy-peer-deps

      # The API client is generated from openapi/asbl-club-api.json (which the backend's
      # OpenApiContractTest keeps in sync with the API). Fail if someone changed the contract
      # without regenerating, or edited generated code by hand.
      - name: Set up JDK 21 (runs the OpenAPI generator)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Generated API client is up to date
        run: |
          npm run api:generate
          git diff --exit-code -- src/app/api/generated

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npm run build

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fails the pull request if it introduces a dependency with a known
      # high-severity vulnerability — the dependency audit in CI.
      - name: Review dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
