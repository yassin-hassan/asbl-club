# Emails (plain text). In messages with {0}, {1}… a single quote is written ''; in email.signature (no
# placeholders) it's written as is.
email.signature=L'équipe asbl.club
email.passwordReset.subject=Réinitialiser votre mot de passe asbl.club
email.passwordReset.body=Bonjour {0},\n\nQuelqu''un (vous, espérons-le) a demandé à changer le mot de passe de votre compte asbl.club. Pour en choisir un nouveau, ouvrez ce lien dans les {2} minutes :\n\n{1}\n\nCe lien ne fonctionne qu''une fois. Si vous n''avez rien demandé, ignorez cet e-mail : votre mot de passe ne change pas.
email.verifyEmail.subject=Confirmez votre adresse e-mail pour asbl.club
email.verifyEmail.body=Bonjour {0},\n\nBienvenue sur asbl.club ! Pour activer votre compte, confirmez votre adresse en ouvrant ce lien dans les {2} heures :\n\n{1}\n\nSi vous n''avez pas créé de compte, ignorez cet e-mail : sans confirmation, rien ne se passe.
email.alreadyRegistered.subject=Vous avez déjà un compte asbl.club
email.alreadyRegistered.body=Bonjour {0},\n\nQuelqu''un (vous, sans doute) a voulu créer un compte asbl.club avec cette adresse, mais vous en avez déjà un.\n\nPour vous connecter : {1}\nMot de passe oublié ? Choisissez-en un nouveau : {2}\n\nSi ce n''était pas vous, ignorez cet e-mail : rien n''a changé.
email.ticketReady.subject=Votre billet pour {1}
email.ticketReady.body=Bonjour {0},\n\nVotre paiement est confirmé : voici votre billet.\n\n{1}\nOrganisé par {8}\nQuand : {2}\nOù : {3}\nBillet : {4} ({5})\n\nMontrez le QR code joint à l''entrée (sur votre téléphone ou imprimé). Si le scan ne marche pas, donnez ce code : {6}\n\nVos billets sont aussi dans « Mes réservations » : {7}
email.ticketReadyGuest.subject=Votre billet pour {1}
email.ticketReadyGuest.body=Bonjour {0},\n\nVotre paiement est confirmé : voici votre billet.\n\n{1}\nOrganisé par {8}\nQuand : {2}\nOù : {3}\nBillet : {4} ({5})\n\nMontrez le QR code joint à l''entrée (sur votre téléphone ou imprimé). Si le scan ne marche pas, donnez ce code : {6}\n\nGardez cet e-mail : le QR code joint est votre billet.
email.guestBooked.subject=Votre réservation pour {1}
email.guestBooked.body=Bonjour {0},\n\nVotre place est réservée :\n\n{1}\nOrganisé par {6}\nQuand : {2}\nBillet : {3} ({4})\n\nPour payer, puis retrouver votre billet, ouvrez ce lien :\n\n{5}\n\nSans paiement rapide, la place est remise en vente. Ce lien est personnel : ne le partagez pas.
email.refundEventCancelled.subject=Remboursement : {1}
email.refundEventCancelled.body=Bonjour {0},\n\nL''événement « {1} » ({3}) a été annulé pendant votre paiement. Nous vous avons donc remboursé {2}. Le remboursement arrive en général sur votre compte sous 5 à 10 jours.
email.refundSoldOut.subject=Remboursement : {1}
email.refundSoldOut.body=Bonjour {0},\n\nVotre réservation pour « {1} » ({3}) a expiré pendant votre paiement, et sa place a été vendue entre-temps. Nous vous avons donc remboursé {2}. Le remboursement arrive en général sur votre compte sous 5 à 10 jours.
email.invitation.subject={0} vous invite à rejoindre {1} sur asbl.club
email.invitation.body=Bonjour,\n\n{0} vous invite à rejoindre {1} sur asbl.club, la plateforme où l''association gère ses membres et ses événements.\n\nPour accepter, ouvrez ce lien (valable {3} jours) :\n\n{2}\n\nPas encore de compte ? Créez-le avec cette adresse e-mail : l''invitation n''est valable que pour elle.\n\nSi vous ne connaissez pas {1}, ignorez cet e-mail.
email.duesPaid.subject=Cotisation {1} payée : {2}
email.duesPaid.body=Bonjour {0},\n\nMerci : votre cotisation {1} à {2} est payée ({3}).\n\nCet email vous sert de reçu. Vous retrouvez vos cotisations sur votre tableau de bord asbl.club.
