<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head(#{events.create})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page">
    <h1 th:text="${asbl.denomination}">Association</h1>
    <p class="muted" th:text="#{events.create}">Créer un événement</p>

    <div class="box">
        <form th:action="@{/asbls/{slug}/events(slug=${asbl.slug})}" th:object="${form}" method="post">
            <div class="field">
                <label for="title" th:text="#{event.title}">Titre</label>
                <input type="text" id="title" th:field="*{title}">
                <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </div>
            <div class="field">
                <label for="description" th:text="#{event.description}">Description</label>
                <textarea id="description" rows="4" th:field="*{description}"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </div>
            <div class="field">
                <label for="startsAt" th:text="#{event.startsAt}">Début</label>
                <input type="datetime-local" id="startsAt" th:field="*{startsAt}">
                <span class="field-error" th:if="${#fields.hasErrors('startsAt')}" th:errors="*{startsAt}"></span>
            </div>
            <div class="field">
                <label for="location" th:text="#{event.location}">Lieu</label>
                <input type="text" id="location" th:field="*{location}">
                <span class="field-error" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></span>
            </div>
            <div class="field">
                <label for="visibility" th:text="#{event.visibility}">Visibilité</label>
                <select id="visibility" th:field="*{visibility}">
                    <option value="PUBLIC" th:text="#{event.visibility.public}">Public</option>
                    <option value="MEMBERS" th:text="#{event.visibility.members}">Membres</option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('visibility')}" th:errors="*{visibility}"></span>
            </div>
            <button type="submit" class="btn btn-primary" th:text="#{event.submit}">Créer l'événement</button>
        </form>
    </div>

    <a class="back-link" th:href="@{/asbls/{slug}/events(slug=${asbl.slug})}" th:text="#{events.title}">Événements</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
