<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head(#{members.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page">
    <h1 th:text="${asbl.denomination}">Association</h1>
    <p class="muted" th:text="#{members.title}">Membres</p>

    <div class="table-wrap">
        <table class="data">
            <thead>
            <tr>
                <th th:text="#{members.name}">Nom</th>
                <th th:text="#{members.email}">Adresse e-mail</th>
                <th th:text="#{members.role}">Rôle</th>
                <th th:text="#{members.status}">Statut</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${members}">
                <td th:text="${m.name}">Nom</td>
                <td th:text="${m.email}">Adresse e-mail</td>
                <td><span class="role-tag" th:text="${m.role}">RÔLE</span></td>
                <td th:text="${m.status}">Statut</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="toolbar">
        <a th:href="@{/asbls/{slug}/events(slug=${asbl.slug})}" class="btn btn-secondary" th:text="#{events.title}">Événements</a>
        <a th:if="${isAdmin}" th:href="@{/asbls/{slug}/audit(slug=${asbl.slug})}" class="btn btn-secondary" th:text="#{audit.title}">Journal d'audit</a>
        <a th:if="${isAdmin and asbl.stripeAccountId == null}" th:href="@{/asbls/{slug}/stripe/connect(slug=${asbl.slug})}" class="btn btn-primary" th:text="#{stripe.connect}">Connecter Stripe</a>
        <a th:if="${isAdmin and asbl.stripeAccountId != null}" th:href="@{/asbls/{slug}/stripe/return(slug=${asbl.slug})}" class="btn btn-secondary" th:text="#{stripe.linked}">Compte Stripe connecté</a>
    </div>

    <a class="back-link" th:href="@{/}" th:text="#{members.back}">Retour à l'accueil</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
