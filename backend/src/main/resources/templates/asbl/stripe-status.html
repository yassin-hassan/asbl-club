<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head(#{stripe.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page">
    <h1 th:text="${asbl.denomination}">Association</h1>
    <p class="muted" th:text="#{stripe.title}">Paiements Stripe</p>

    <div th:if="${ready}" class="alert alert-success" th:text="#{stripe.ready}">Le compte est prêt.</div>

    <div th:unless="${ready}" class="box">
        <p th:text="#{stripe.pending}">La connexion n'est pas terminée.</p>
        <a th:href="@{/asbls/{slug}/stripe/connect(slug=${asbl.slug})}" class="btn btn-primary" th:text="#{stripe.continue}">Continuer</a>
    </div>

    <a class="back-link" th:href="@{/asbls/{slug}/members(slug=${asbl.slug})}" th:text="#{members.title}">Membres</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
