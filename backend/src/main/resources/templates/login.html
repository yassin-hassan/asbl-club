<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head(#{login.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="auth-page">
    <div class="auth-card">
        <h1 th:text="#{login.title}">Connexion</h1>

        <div th:if="${param.registered != null}" class="alert alert-success" th:text="#{login.registered}">Compte créé</div>
        <div th:if="${param.error != null}" class="alert alert-error" th:text="#{login.error}">Erreur</div>
        <div th:if="${param.logout != null}" class="alert alert-info" th:text="#{login.logout}">Déconnecté</div>
        <div th:if="${param.deleted != null}" class="alert alert-info" th:text="#{login.deleted}">Compte supprimé</div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="username" th:text="#{login.email}">Adresse e-mail</label>
                <input type="email" id="username" name="username" autocomplete="email">
            </div>
            <div class="field">
                <label for="password" th:text="#{login.password}">Mot de passe</label>
                <input type="password" id="password" name="password" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" th:text="#{login.submit}">Se connecter</button>
        </form>

        <p class="auth-alt">
            <a th:href="@{/register}" th:text="#{login.noAccount}">Pas encore de compte</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
