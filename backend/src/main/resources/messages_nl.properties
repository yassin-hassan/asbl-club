# Emails (plain text). In messages with {0}, {1}… a single quote is written ''; in email.signature (no
# placeholders) it's written as is.
email.signature=Het asbl.club-team
email.passwordReset.subject=Stel je asbl.club-wachtwoord opnieuw in
email.passwordReset.body=Hallo {0},\n\nIemand (hopelijk jij) vroeg om het wachtwoord van je asbl.club-account te wijzigen. Open deze link binnen {2} minuten om een nieuw wachtwoord te kiezen:\n\n{1}\n\nDe link werkt één keer. Heb je niets gevraagd? Negeer dan deze e-mail: je wachtwoord blijft hetzelfde.
email.verifyEmail.subject=Bevestig je e-mailadres voor asbl.club
email.verifyEmail.body=Hallo {0},\n\nWelkom bij asbl.club! Bevestig je adres om je account te activeren door deze link binnen {2} uur te openen:\n\n{1}\n\nHeb je geen account aangemaakt? Negeer dan deze e-mail: zonder bevestiging gebeurt er niets.
email.alreadyRegistered.subject=Je hebt al een asbl.club-account
email.alreadyRegistered.body=Hallo {0},\n\nIemand (waarschijnlijk jij) probeerde een asbl.club-account aan te maken met dit adres, maar je hebt er al een.\n\nInloggen: {1}\nWachtwoord vergeten? Kies een nieuw: {2}\n\nWas jij het niet? Negeer dan deze e-mail: er is niets veranderd.
email.ticketReady.subject=Je ticket voor {1}
email.ticketReady.body=Hallo {0},\n\nJe betaling is bevestigd: hier is je ticket.\n\n{1}\nGeorganiseerd door {8}\nWanneer: {2}\nWaar: {3}\nTicket: {4} ({5})\n\nToon de bijgevoegde QR-code aan de ingang (op je telefoon of afgedrukt). Lukt het scannen niet, geef dan deze code: {6}\n\nJe tickets staan ook onder “Mijn boekingen”: {7}
email.refundEventCancelled.subject=Terugbetaling: {1}
email.refundEventCancelled.body=Hallo {0},\n\nHet evenement “{1}” ({3}) werd geannuleerd terwijl je betaalde, dus we hebben {2} terugbetaald. De terugbetaling staat meestal binnen 5 tot 10 dagen op je rekening.
email.refundSoldOut.subject=Terugbetaling: {1}
email.refundSoldOut.body=Hallo {0},\n\nJe boeking voor “{1}” ({3}) verliep terwijl je betaalde, en de plaats werd intussen verkocht, dus we hebben {2} terugbetaald. De terugbetaling staat meestal binnen 5 tot 10 dagen op je rekening.
