server:
  port: ${PORT:8080}
  # Behind the hosting platform's proxy: take the client IP and scheme from X-Forwarded-* headers, but
  # only when the request comes from an internal (private-range) proxy address, so clients can't fake them.
  # Needed for per-IP rate limiting, correct audit IPs, and HTTPS-aware redirects and HSTS.
  forward-headers-strategy: native

spring:
  application:
    name: asbl-club
  messages:
    fallback-to-system-locale: false
  devtools:
    restart:
      exclude: db/migration/**
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: false

info:
  app:
    name: ASBL Club
    description: Management portal for associations
    version: 1.0.0

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

bookings:
  # An unpaid booking gives its seat back after this long (Stripe's form, 3-D Secure included, takes a few minutes).
  expire-after: ${BOOKINGS_EXPIRE_AFTER:30m}

jwt:
  # PKCS#8 PEM private key (a secret: SSM Parameter Store in production). Empty = temporary key (dev/tests).
  signing-key: ${JWT_SIGNING_KEY:}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}

# The CDN in front (a Cloudflare Worker proxies /api/* here). Both set = requests carrying the secret are taken as
# coming from the visitor at the public address (see EdgeProxyFilter). Both empty = no CDN in front.
edge:
  secret: ${EDGE_PROXY_SECRET:}
  public-url: ${EDGE_PUBLIC_URL:}

springdoc:
  # The API description (/v3/api-docs) and Swagger UI are off unless API_DOCS_ENABLED=true (e.g. locally):
  # production doesn't advertise its endpoints. The contract lives in frontend/openapi/ (OpenApiContractTest).
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    # springdoc 3 writes OpenAPI 3.1 by default; the Angular client generator's 3.1 support is still beta,
    # so the contract stays on 3.0 until it isn't.
    version: openapi_3_0
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  paths-to-match: /api/**
  # Describe responses as JSON (instead of */*), so generated clients parse them.
  default-produces-media-type: application/json
