server:
  port: ${PORT:8080}
  # Behind the hosting platform's proxy: take the client IP and scheme from X-Forwarded-* headers, but
  # only when the request comes from an internal (private-range) proxy address, so clients can't fake them.
  # Needed for per-IP rate limiting, correct audit IPs, and HTTPS-aware redirects and HSTS.
  forward-headers-strategy: native

spring:
  application:
    name: asbl-club
  messages:
    fallback-to-system-locale: false
  devtools:
    restart:
      exclude: db/migration/**
  # Outgoing email over SMTP: Mailpit locally (compose.yaml, web inbox on http://localhost:8025), the provider's
  # SMTP relay in production (MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD). Changing provider is configuration.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      # With TLS on, it's required: if the server doesn't offer it, the email isn't sent, rather than the SMTP key
      # going over the network in clear (port 2525 starts unencrypted). Off locally: Mailpit has no TLS.
      mail.smtp.starttls.required: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# Logs as plain text locally; one JSON object per line in production (LOG_FORMAT=ecs, Elastic Common Schema),
# so a log search can filter by field: requestId, status, level… Each request's lines share its requestId
# (RequestIdFilter), shown in text logs too.
logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  pattern:
    correlation: "[%X{requestId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Email goes out in the background with retries; an unreachable mail server must not mark the whole
    # application DOWN (the host's health check would restart it, and nothing would be gained).
    mail:
      enabled: false
  info:
    env:
      enabled: false

info:
  app:
    name: ASBL Club
    description: Management portal for associations
    version: 1.0.0

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# Where links in emails point to: the site people use (never taken from a request's Host header, which a client
# controls). Behind the Worker it's the Worker's address; locally the Angular dev server.
app:
  public-url: ${APP_PUBLIC_URL:${EDGE_PUBLIC_URL:http://localhost:4200}}

email:
  from: ${MAIL_FROM:asbl.club <no-reply@asbl.club.local>}
  # The background sender; the test suite switches it off (only the email tests turn it on).
  sender-enabled: ${MAIL_SENDER_ENABLED:true}
  # How often it looks at the outbox (the e2e runs use half a second, so sign-ups don't wait).
  send-every-ms: ${MAIL_SEND_EVERY_MS:10000}

bookings:
  # An unpaid booking gives its seat back after this long (Stripe's form, 3-D Secure included, takes a few minutes).
  expire-after: ${BOOKINGS_EXPIRE_AFTER:30m}

jwt:
  # PKCS#8 PEM private key (a secret: SSM Parameter Store in production). Empty = temporary key (dev/tests).
  signing-key: ${JWT_SIGNING_KEY:}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}

# The CDN in front (a Cloudflare Worker proxies /api/* here). Both set = requests carrying the secret are taken as
# coming from the visitor at the public address (see EdgeProxyFilter). Both empty = no CDN in front.
edge:
  secret: ${EDGE_PROXY_SECRET:}
  public-url: ${EDGE_PUBLIC_URL:}

springdoc:
  # The API description (/v3/api-docs) and Swagger UI are off unless API_DOCS_ENABLED=true (e.g. locally):
  # production doesn't advertise its endpoints. The contract lives in frontend/openapi/ (OpenApiContractTest).
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    # springdoc 3 writes OpenAPI 3.1 by default; the Angular client generator's 3.1 support is still beta,
    # so the contract stays on 3.0 until it isn't.
    version: openapi_3_0
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  paths-to-match: /api/**
  # Describe responses as JSON (instead of */*), so generated clients parse them.
  default-produces-media-type: application/json
