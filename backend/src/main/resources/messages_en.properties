# Emails (plain text). In messages with {0}, {1}… a single quote is written ''; in email.signature (no
# placeholders) it's written as is.
email.signature=The asbl.club team
email.passwordReset.subject=Reset your asbl.club password
email.passwordReset.body=Hello {0},\n\nSomeone (hopefully you) asked to change the password of your asbl.club account. To choose a new one, open this link within {2} minutes:\n\n{1}\n\nThe link works once. If you didn''t ask for this, ignore this email: your password stays the same.
email.verifyEmail.subject=Confirm your email address for asbl.club
email.verifyEmail.body=Hello {0},\n\nWelcome to asbl.club! To activate your account, confirm your address by opening this link within {2} hours:\n\n{1}\n\nIf you didn''t create an account, ignore this email: without confirmation, nothing happens.
email.alreadyRegistered.subject=You already have an asbl.club account
email.alreadyRegistered.body=Hello {0},\n\nSomeone (probably you) tried to create an asbl.club account with this address, but you already have one.\n\nTo log in: {1}\nForgot your password? Choose a new one: {2}\n\nIf it wasn''t you, ignore this email: nothing has changed.
email.ticketReady.subject=Your ticket for {1}
email.ticketReady.body=Hello {0},\n\nYour payment is confirmed: here is your ticket.\n\n{1}\nOrganised by {8}\nWhen: {2}\nWhere: {3}\nTicket: {4} ({5})\n\nShow the attached QR code at the entrance (on your phone or printed). If scanning fails, give this code: {6}\n\nYour tickets are also under “My bookings”: {7}
email.refundEventCancelled.subject=Refund: {1}
email.refundEventCancelled.body=Hello {0},\n\nThe event “{1}” ({3}) was cancelled while you were paying, so we have refunded {2}. The refund usually reaches your account within 5 to 10 days.
email.refundSoldOut.subject=Refund: {1}
email.refundSoldOut.body=Hello {0},\n\nYour booking for “{1}” ({3}) expired while you were paying, and its seat was sold in the meantime, so we have refunded {2}. The refund usually reaches your account within 5 to 10 days.
email.invitation.subject={0} invites you to join {1} on asbl.club
email.invitation.body=Hello,\n\n{0} invites you to join {1} on asbl.club, where the association manages its members and events.\n\nTo accept, open this link (valid {3} days):\n\n{2}\n\nNo account yet? Create one with this email address: the invitation only works for it.\n\nIf you don''t know {1}, ignore this email.
email.duesPaid.subject={1} dues paid: {2}
email.duesPaid.body=Hello {0},\n\nThank you: your {1} dues to {2} are paid ({3}).\n\nThis email is your receipt. Your dues are also on your asbl.club dashboard.
