# Test-only settings, layered on top of src/main/resources/application.yaml.
# The suite logs in many times from the same address; the rate limiter would start refusing it.
# AuthRateLimitIntegrationTest switches it back on for itself.
rate-limit.enabled=false

# Emails are queued in the outbox but not sent, except by the tests about email (they point it at GreenMail).
email.sender-enabled=false
