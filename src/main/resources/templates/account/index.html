<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head(#{account.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page">
    <h1 th:text="#{account.title}">Mon compte</h1>
    <p class="muted" th:text="${#authentication.name}">email</p>

    <div class="box">
        <h2 th:text="#{account.export}">Exporter mes données</h2>
        <a th:href="@{/account/export}" class="btn btn-secondary" th:text="#{account.export}">Exporter mes données</a>
    </div>

    <div class="box danger">
        <h2 th:text="#{account.deleteTitle}">Supprimer mon compte</h2>
        <p th:text="#{account.deleteWarning}">Cette action est irréversible.</p>
        <form th:action="@{/account/delete}" method="post">
            <button type="submit" class="btn btn-danger" th:text="#{account.delete}">Supprimer définitivement</button>
        </form>
    </div>

    <a class="back-link" th:href="@{/}" th:text="#{account.back}">Retour à l'accueil</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
