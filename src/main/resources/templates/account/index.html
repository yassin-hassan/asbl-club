<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title th:text="#{account.title}">My account</title>
</head>
<body>
<nav>
    <a th:href="@{/account(lang='fr')}" th:text="#{lang.fr}">Français</a>
    <a th:href="@{/account(lang='nl')}" th:text="#{lang.nl}">Nederlands</a>
    <a th:href="@{/account(lang='en')}" th:text="#{lang.en}">English</a>
</nav>

<h1 th:text="#{account.title}">My account</h1>
<p th:text="${#authentication.name}">email</p>

<p><a th:href="@{/account/export}" th:text="#{account.export}">Export my data</a></p>

<h2 th:text="#{account.deleteTitle}">Delete my account</h2>
<p th:text="#{account.deleteWarning}">This action is irreversible.</p>
<form th:action="@{/account/delete}" method="post">
    <button type="submit" th:text="#{account.delete}">Delete permanently</button>
</form>

<p><a th:href="@{/}" th:text="#{account.back}">Back to home</a></p>
</body>
</html>
