<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head(#{home.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="wrap dash">
    <h1 th:text="#{home.yourAsbls}">Vos associations</h1>
    <p class="hello" th:text="#{home.greeting(${#authentication.name})}">Bonjour</p>

    <div th:if="${asbls.isEmpty()}" class="empty">
        <p th:text="#{home.noAsbls}">Vous n'avez encore aucune association</p>
        <p style="margin-top:14px">
            <a th:href="@{/asbls/new}" class="btn btn-primary" th:text="#{home.createAsbl}">Créer une ASBL</a>
        </p>
    </div>

    <div th:unless="${asbls.isEmpty()}">
        <div class="asbl-list">
            <a th:each="a : ${asbls}" th:href="@{/asbls/{slug}/members(slug=${a.slug})}" class="asbl-item">
                <span class="name" th:text="${a.denomination}">Nom</span>
                <span class="role-tag" th:text="${a.role}">RÔLE</span>
            </a>
        </div>
        <p style="margin-top:20px">
            <a th:href="@{/asbls/new}" class="btn btn-primary" th:text="#{home.createAsbl}">Créer une ASBL</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
