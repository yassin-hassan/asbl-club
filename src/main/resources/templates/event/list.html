<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head(#{events.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page">
    <div class="page-head">
        <div>
            <h1 th:text="${asbl.denomination}">Association</h1>
            <p class="muted" th:text="#{events.title}">Événements</p>
        </div>
        <a th:if="${isAdmin}" th:href="@{/asbls/{slug}/events/new(slug=${asbl.slug})}" class="btn btn-primary" th:text="#{events.create}">Créer un événement</a>
    </div>

    <div th:if="${events.isEmpty()}" class="empty" th:text="#{events.none}">Aucun événement pour l'instant</div>

    <div th:unless="${events.isEmpty()}" class="event-list">
        <a th:each="e : ${events}" class="event-row"
           th:href="@{/asbls/{slug}/events/{eventId}(slug=${asbl.slug},eventId=${e.id})}">
            <span class="ev-main">
                <span class="ev-title" th:text="${e.title}">Titre</span>
                <span class="ev-meta">
                    <span th:text="${e.startsAt}">Début</span>
                    <span class="tag" th:text="${e.status}">Statut</span>
                    <span class="tag" th:text="${e.visibility}">Visibilité</span>
                </span>
            </span>
            <span class="ev-go" aria-hidden="true">→</span>
        </a>
    </div>

    <a class="back-link" th:href="@{/asbls/{slug}/members(slug=${asbl.slug})}" th:text="#{events.members}">Membres</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
