<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head(#{events.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page">
    <div class="page-head">
        <div>
            <h1 th:text="${asbl.denomination}">Association</h1>
            <p class="muted" th:text="#{events.title}">Événements</p>
        </div>
        <a th:if="${isAdmin}" th:href="@{/asbls/{slug}/events/new(slug=${asbl.slug})}" class="btn btn-primary" th:text="#{events.create}">Créer un événement</a>
    </div>

    <div th:if="${events.isEmpty()}" class="empty" th:text="#{events.none}">Aucun événement pour l'instant</div>

    <div th:unless="${events.isEmpty()}" class="table-wrap">
        <table class="data">
            <thead>
            <tr>
                <th th:text="#{event.title}">Titre</th>
                <th th:text="#{event.startsAt}">Début</th>
                <th th:text="#{event.status}">Statut</th>
                <th th:text="#{event.visibility}">Visibilité</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${events}">
                <td>
                    <a class="link" th:href="@{/asbls/{slug}/events/{eventId}(slug=${asbl.slug},eventId=${e.id})}" th:text="${e.title}">Titre</a>
                </td>
                <td th:text="${e.startsAt}">Début</td>
                <td th:text="${e.status}">Statut</td>
                <td th:text="${e.visibility}">Visibilité</td>
            </tr>
            </tbody>
        </table>
    </div>

    <a class="back-link" th:href="@{/asbls/{slug}/members(slug=${asbl.slug})}" th:text="#{events.members}">Membres</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
