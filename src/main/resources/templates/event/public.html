<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title th:text="${event.title}">Event</title>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="asbl.club">
    <meta property="og:title" th:attr="content=${event.title}">
    <meta property="og:description" th:if="${event.description}" th:attr="content=${event.description}">
    <meta property="og:url" th:attr="content=${canonicalUrl}">
</head>
<body>
<nav>
    <a th:href="@{/events/{id}(id=${event.id},lang='fr')}" th:text="#{lang.fr}">Français</a>
    <a th:href="@{/events/{id}(id=${event.id},lang='nl')}" th:text="#{lang.nl}">Nederlands</a>
    <a th:href="@{/events/{id}(id=${event.id},lang='en')}" th:text="#{lang.en}">English</a>
</nav>

<h1 th:text="${event.title}">Event title</h1>
<p th:text="${event.asbl.denomination}">Association</p>
<p><span th:text="#{event.startsAt}">Start</span> <span th:text="${event.startsAt}">2026-01-01</span></p>
<p th:if="${event.location}"><span th:text="#{event.location}">Location</span> <span th:text="${event.location}">Location</span></p>
<p th:if="${event.description}" th:text="${event.description}">Description</p>

<h2 th:text="#{tickets.title}">Ticket categories</h2>
<p th:if="${tickets.isEmpty()}" th:text="#{tickets.none}">No ticket categories yet</p>
<table th:unless="${tickets.isEmpty()}">
    <thead>
    <tr>
        <th th:text="#{ticket.label}">Label</th>
        <th th:text="#{ticket.price}">Price</th>
        <th th:text="#{ticket.seats}">Seats</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="t : ${tickets}">
        <td th:text="${t.label}">Label</td>
        <td th:text="${t.price}">Price</td>
        <td th:id="'seats-' + ${t.id}" th:text="${t.totalSeats - t.soldSeats}">Seats</td>
    </tr>
    </tbody>
</table>

<h2 th:text="#{share.title}">Share</h2>
<p>
    <a th:href="'https://wa.me/?text=' + ${canonicalUrl}" target="_blank" rel="noopener">WhatsApp</a>
    <a th:href="'mailto:?body=' + ${canonicalUrl}">Email</a>
</p>

<script th:inline="javascript">
    const eventId = /*[[${event.id}]]*/ 0;
    function refreshSeats() {
        fetch('/events/' + eventId + '/availability')
            .then(response => response.json())
            .then(categories => categories.forEach(function (category) {
                const cell = document.getElementById('seats-' + category.categoryId);
                if (cell) {
                    cell.textContent = category.remaining;
                }
            }));
    }
    refreshSeats();
    setInterval(refreshSeats, 5000);
</script>
</body>
</html>
