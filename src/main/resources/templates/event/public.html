<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${event.title}">Event</title>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="asbl.club">
    <meta property="og:title" th:attr="content=${event.title}">
    <meta property="og:description" th:if="${event.description}" th:attr="content=${event.description}">
    <meta property="og:url" th:attr="content=${canonicalUrl}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page">
    <h1 th:text="${event.title}">Titre de l'événement</h1>
    <p class="muted" th:text="${event.asbl.denomination}">Association</p>

    <div class="meta">
        <div><span class="k" th:text="#{event.startsAt}">Début</span><span class="v" th:text="${event.startsAt}">2026-01-01</span></div>
        <div th:if="${event.location}"><span class="k" th:text="#{event.location}">Lieu</span><span class="v" th:text="${event.location}">Lieu</span></div>
    </div>

    <p th:if="${event.description}" style="margin-top:20px;color:var(--slate-600)" th:text="${event.description}">Description</p>

    <h2 style="font-size:20px;color:var(--indigo-900);margin:28px 0 8px" th:text="#{tickets.title}">Catégories tarifaires</h2>
    <div th:if="${tickets.isEmpty()}" class="empty" th:text="#{tickets.none}">Aucune catégorie pour l'instant</div>
    <div th:unless="${tickets.isEmpty()}" class="table-wrap">
        <table class="data">
            <thead>
            <tr>
                <th th:text="#{ticket.label}">Libellé</th>
                <th th:text="#{ticket.price}">Prix</th>
                <th th:text="#{ticket.seats}">Places</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${tickets}">
                <td th:text="${t.label}">Libellé</td>
                <td th:text="${t.price}">Prix</td>
                <td th:id="'seats-' + ${t.id}" th:text="${t.totalSeats - t.soldSeats}">Places</td>
            </tr>
            </tbody>
        </table>
    </div>

    <h2 style="font-size:20px;color:var(--indigo-900);margin:28px 0 8px" th:text="#{share.title}">Partager</h2>
    <div class="toolbar" style="margin-top:0">
        <a th:href="'https://wa.me/?text=' + ${canonicalUrl}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">WhatsApp</a>
        <a th:href="'mailto:?body=' + ${canonicalUrl}" class="btn btn-secondary btn-sm">Email</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:inline="javascript">
    const eventId = /*[[${event.id}]]*/ 0;
    function refreshSeats() {
        fetch('/events/' + eventId + '/availability')
            .then(response => response.json())
            .then(categories => categories.forEach(function (category) {
                const cell = document.getElementById('seats-' + category.categoryId);
                if (cell) {
                    cell.textContent = category.remaining;
                }
            }));
    }
    refreshSeats();
    setInterval(refreshSeats, 5000);
</script>
</body>
</html>
