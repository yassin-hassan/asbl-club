<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head(#{register.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="auth-page">
    <div class="auth-card">
        <h1 th:text="#{register.title}">Créer un compte</h1>

        <form th:action="@{/register}" th:object="${form}" method="post">
            <div class="field">
                <label for="name" th:text="#{register.name}">Nom</label>
                <input type="text" id="name" th:field="*{name}" autocomplete="name">
                <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>
            <div class="field">
                <label for="email" th:text="#{register.email}">Adresse e-mail</label>
                <input type="email" id="email" th:field="*{email}" autocomplete="email">
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <div class="field">
                <label for="password" th:text="#{register.password}">Mot de passe</label>
                <input type="password" id="password" th:field="*{password}" autocomplete="new-password">
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>
            <button type="submit" class="btn btn-primary" th:text="#{register.submit}">Créer le compte</button>
        </form>

        <p class="auth-alt">
            <a th:href="@{/login}" th:text="#{register.haveAccount}">J'ai déjà un compte</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
