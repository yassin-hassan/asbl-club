<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head(#{asbl.create.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page">
    <h1 th:text="#{asbl.create.title}">Créer une ASBL</h1>

    <div class="box">
        <form th:action="@{/asbls}" th:object="${form}" method="post">
            <div class="field">
                <label for="denomination" th:text="#{asbl.denomination}">Dénomination</label>
                <input type="text" id="denomination" th:field="*{denomination}">
                <span class="field-error" th:if="${#fields.hasErrors('denomination')}" th:errors="*{denomination}"></span>
            </div>
            <div class="field">
                <label for="bceNumber" th:text="#{asbl.bceNumber}">Numéro BCE</label>
                <input type="text" id="bceNumber" th:field="*{bceNumber}" placeholder="0123.456.789">
                <span class="field-error" th:if="${#fields.hasErrors('bceNumber')}" th:errors="*{bceNumber}"></span>
            </div>
            <div class="field">
                <label for="slug" th:text="#{asbl.slug}">Identifiant d'URL</label>
                <input type="text" id="slug" th:field="*{slug}" placeholder="mon-club">
                <span class="field-error" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></span>
            </div>
            <div class="field">
                <label for="defaultLanguage" th:text="#{asbl.language}">Langue principale</label>
                <select id="defaultLanguage" th:field="*{defaultLanguage}">
                    <option value="fr" th:text="#{lang.fr}">Français</option>
                    <option value="nl" th:text="#{lang.nl}">Nederlands</option>
                    <option value="en" th:text="#{lang.en}">English</option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('defaultLanguage')}" th:errors="*{defaultLanguage}"></span>
            </div>
            <button type="submit" class="btn btn-primary" th:text="#{asbl.submit}">Créer l'ASBL</button>
        </form>
    </div>

    <a class="back-link" th:href="@{/}" th:text="#{account.back}">Retour à l'accueil</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
