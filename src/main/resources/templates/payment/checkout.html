<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{payment.title}">Paiement</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page" style="max-width:480px">
    <h1 th:text="#{payment.title}">Paiement</h1>
    <div class="pay-amount">
        <span th:text="${amount}">0.00</span> EUR
    </div>

    <div class="box">
        <form id="payment-form">
            <div id="payment-element"></div>
            <button id="submit" type="submit" class="btn btn-primary" style="width:100%;margin-top:16px" th:text="#{payment.pay}">Payer</button>
            <p id="message" class="pay-message"></p>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:inline="javascript">
    const publishableKey = /*[[${publishableKey}]]*/ '';
    const stripeAccount = /*[[${stripeAccount}]]*/ '';
    const clientSecret = /*[[${clientSecret}]]*/ '';
    const registrationId = /*[[${registrationId}]]*/ '';

    const stripe = Stripe(publishableKey, {stripeAccount: stripeAccount});
    const elements = stripe.elements({clientSecret: clientSecret});
    const paymentElement = elements.create('payment');
    paymentElement.mount('#payment-element');

    const form = document.getElementById('payment-form');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const {error} = await stripe.confirmPayment({
            elements,
            confirmParams: {
                return_url: window.location.origin + '/pay/' + registrationId + '/complete'
            }
        });
        if (error) {
            message.textContent = error.message;
        }
    });
</script>
</body>
</html>
