legal.notice.title=Wettelijke vermeldingen
legal.notice.body=asbl.club is een beheerplatform voor Belgische verenigingen zonder winstoogmerk. Deze site wordt uitgegeven in het kader van een eindwerk en is een prototype. De definitieve uitgeversgegevens en de identiteit van de uitgever en de host worden vóór elke ingebruikname gepreciseerd.
legal.privacy.title=Privacy (AVG)
legal.privacy.body=asbl.club verwerkt persoonsgegevens met inachtneming van de Algemene Verordening Gegevensbescherming. De verzamelde gegevens dienen uitsluitend voor het beheer van accounts, lidmaatschappen en betalingen. U heeft recht op inzage, verbetering en verwijdering van uw gegevens, uit te oefenen via uw account of op eenvoudig verzoek.
legal.cookies.title=Cookies
legal.cookies.body=asbl.club gebruikt uitsluitend technische cookies die nodig zijn voor de werking van de site, met name om uw sessie te behouden en uw taal te onthouden. Er worden geen advertentie-trackingcookies geplaatst zonder uw toestemming.

