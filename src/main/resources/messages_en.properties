footer.legal=Legal

legal.notice.title=Legal notice
legal.notice.body=asbl.club is a management platform for Belgian non-profit associations. This site is published as part of a final-year student project and is a prototype. The final publication details and the identity of the publisher and the host will be specified before any production release.
legal.privacy.title=Privacy (GDPR)
legal.privacy.body=asbl.club processes personal data in accordance with the General Data Protection Regulation. The data collected is used solely to manage accounts, memberships and payments. You have the right to access, correct and delete your data, which you can exercise from your account area or on request.
legal.cookies.title=Cookies
legal.cookies.body=asbl.club uses only technical cookies necessary for the site to function, in particular to keep your session and remember your language. No advertising tracking cookies are placed without your consent.

